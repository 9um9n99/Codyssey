<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조리하기 — 조각조각</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">🥒 조각조각</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">조각내기</a>
      <a href="calendar.html" class="nav-link active">조리하기</a>
      <a href="record.html" class="nav-link">나의요리</a>
    </nav>
  </header>

  <main class="calendar-main">
    <header class="calendar-page-header">
      <h1 class="calendar-title">조리 중인 요리</h1>
      <p class="calendar-subtitle" id="calendar-subtitle"></p>
    </header>

    <!-- 오늘 할 조각: 목표마다 "지금 차례인 조각" 하나씩, 급한 순서로 (조각 순서는 건드리지 않음) -->
    <section class="today-panel" id="today-panel" aria-labelledby="today-title" hidden>
      <div class="today-head">
        <h2 id="today-title">오늘 할 조각</h2>
        <p class="today-sub" id="today-sub"></p>
      </div>
      <ol class="today-list" id="today-list"></ol>
    </section>

    <!-- 대시보드: 달력 + 진행 목록 2단 구성 (진행 중인 게 없어도 캘린더 틀은 항상 유지) -->
    <div class="calendar-layout" id="calendar-layout">

      <section class="calendar-panel" id="calendar-panel">
        <div class="calendar-nav">
          <button type="button" class="calendar-nav-btn" id="calendar-prev" aria-label="이전 달">←</button>
          <p class="calendar-month-label" id="calendar-month-label"></p>
          <button type="button" class="calendar-nav-btn" id="calendar-next" aria-label="다음 달">→</button>
        </div>
        <div class="calendar-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <div class="calendar-legend" id="calendar-legend"></div>
      </section>

      <section class="plans-panel" id="plans-panel">
        <div class="plans-panel-header">
          <div class="plans-panel-header-text">
            <h2>목표별 진행 현황</h2>
            <p class="plans-summary" id="plans-summary"></p>
          </div>
          <button type="button" class="chip-toggle-btn" id="edit-mode-toggle">편집</button>
        </div>

        <!-- 편집 모드일 때만 나타나는 선택/삭제 툴바 -->
        <div class="bulk-actions-bar" id="bulk-actions-bar" hidden>
          <label class="bulk-select-all">
            <input type="checkbox" id="bulk-select-all-checkbox" aria-label="전체 선택">
            <span id="bulk-selected-count">0개 선택됨</span>
          </label>
          <button type="button" class="text-btn" id="bulk-delete-btn" disabled>선택 삭제</button>
        </div>

        <!-- 진행 중인 게 없을 때, 이 패널 안에만 표시 -->
        <div class="plans-empty" id="plans-empty" hidden>
          <img src="images/kid_job_girl_chef.png" alt="" class="empty-image">
          <p class="empty-text">아직 조리 중인 요리가 없어요.</p>
          <a href="index.html" class="btn-primary">조각내러 가기 →</a>
        </div>

        <div class="active-plans-list" id="active-plans-list"></div>
      </section>

    </div>
  </main>

  <!-- 삭제/수정 전에 한 번 더 확인하는 공통 팝업 -->
  <div class="confirm-modal-backdrop" id="confirm-modal-backdrop" hidden>
    <div class="confirm-modal">
      <p class="confirm-modal-message" id="confirm-modal-message"></p>
      <div class="confirm-modal-actions">
        <button type="button" class="btn-secondary" id="confirm-modal-cancel">취소</button>
        <button type="button" class="btn-primary" id="confirm-modal-confirm">확인</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>🥒 조각조각 — Codyssey AI 웹 개발 미션 프로젝트</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
