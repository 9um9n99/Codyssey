<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오이 썰기 — 조각조각</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">🥒 조각조각</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">메인</a>
      <a href="cutting.html" class="nav-link active">오이 썰기</a>
      <a href="calendar.html" class="nav-link">캘린더</a>
      <a href="record.html" class="nav-link">오늘의 요리판</a>
    </nav>
  </header>

  <main class="cutting-main">

    <!-- 입력 폼 -->
    <section class="cutting-form-section" id="form-section">
      <h1 class="cutting-title">어떤 목표를 썰어드릴까요?</h1>

      <form id="goal-form" class="goal-form" novalidate>
        <label for="goal-input" class="form-label">목표 (통오이)</label>
        <textarea
          id="goal-input"
          class="goal-input"
          rows="3"
          placeholder="예: 리디자인 포트폴리오 만들기"
        ></textarea>
        <p class="field-error" id="goal-error" hidden>목표를 입력해주세요. 오이가 없으면 썰 수 없어요 🥒</p>

        <label class="form-label">기한 (며칠 안에 끝낼까요?)</label>
        <div class="days-stepper">
          <button type="button" class="stepper-btn" id="days-minus" aria-label="기한 줄이기">−</button>
          <input type="number" id="days-input" class="days-input" value="7" min="1" max="90" inputmode="numeric">
          <button type="button" class="stepper-btn" id="days-plus" aria-label="기한 늘리기">+</button>
          <span class="days-unit">일</span>
        </div>

        <button type="submit" class="btn-primary submit-btn">오이 썰어주세요 🔪</button>
      </form>
    </section>

    <!-- 로딩 상태 -->
    <section class="loading-section" id="loading-section" hidden>
      <div class="chef-stage" aria-hidden="true">
        <div class="chef-placeholder">🧑‍🍳</div>
        <div class="cutting-board">
          <span class="board-slice"></span>
          <span class="board-slice"></span>
          <span class="board-slice"></span>
        </div>
      </div>
      <p class="loading-text" id="loading-text">오이 손질사가 목표를 살펴보는 중...</p>
    </section>

    <!-- API 오류 -->
    <section class="error-section" id="error-section" hidden>
      <p class="error-message" id="error-message"></p>
      <button type="button" class="btn-secondary" id="retry-btn">다시 시도하기</button>
    </section>

    <!-- 결과 -->
    <section class="result-section" id="result-section" hidden>
      <p class="result-eyebrow" id="result-eyebrow"></p>
      <h2 class="result-title" id="result-title"></h2>

      <ol class="pieces-list" id="pieces-list"></ol>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="progress-label" id="progress-label"></p>

      <div class="completion-banner" id="completion-banner" hidden>
        <p id="completion-text"></p>
        <a href="record.html" class="btn-primary">요리판에서 확인하기 →</a>
      </div>

      <button type="button" class="text-btn" id="new-goal-btn">다른 목표 썰어보기</button>
    </section>

  </main>

  <footer class="site-footer">
    <p>🥒 조각조각 — Codyssey AI 웹 개발 미션 프로젝트</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cutting.js"></script>
</body>
</html>
