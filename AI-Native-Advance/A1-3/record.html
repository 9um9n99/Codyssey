<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요리 도감 — 조각조각</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">🥒 조각조각</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">메인</a>
      <a href="cutting.html" class="nav-link">오이 썰기</a>
      <a href="calendar.html" class="nav-link">캘린더</a>
      <a href="record.html" class="nav-link active">오늘의 요리판</a>
    </nav>
  </header>

  <main class="record-main">
    <h1 class="record-title">오늘의 요리판</h1>
    <p class="record-subtitle-plain">지금까지 완성한 목표들이 요리로 기록돼요.</p>

    <!-- 완성 기록 없을 때 -->
    <section class="empty-state" id="empty-state" hidden>
      <p class="empty-emoji">🥒</p>
      <p class="empty-text">아직 완성한 요리가 없어요.</p>
      <a href="cutting.html" class="btn-primary">첫 오이 썰러 가기 →</a>
    </section>

    <!-- 완성 기록 리스트 -->
    <section class="record-list" id="record-list"></section>

    <div class="section-divider"></div>

    <h2 class="dex-heading">요리 도감</h2>
    <p class="record-subtitle" id="record-progress"></p>

    <div class="dex-tiers" id="dex-tiers"></div>
  </main>

  <!-- 상세 모달 -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-dish-name">
      <button type="button" class="modal-close" id="modal-close" aria-label="닫기">×</button>
      <h2 class="modal-dish-name" id="modal-dish-name"></h2>
      <p class="modal-count" id="modal-count"></p>
      <div class="modal-tags" id="modal-tags" hidden></div>
      <ol class="modal-history" id="modal-history"></ol>
    </div>
  </div>

  <footer class="site-footer">
    <p>🥒 조각조각 — Codyssey AI 웹 개발 미션 프로젝트</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/record.js"></script>
</body>
</html>
